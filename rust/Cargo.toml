[workspace]
resolver = "3"
members = ["./crates/*"]

[workspace.package]
version = "0.0.46"
edition = "2024"

[workspace.dependencies]
proj-sys = { path = "./crates/proj-sys" }

clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.5" }
envoy = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.5" }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.5" }

bindgen = "0.73.2"
criterion = { package = "codspeed-criterion-compat", version = "5.0.2" }
derive-getters = { version = "0.5.0", features = ["auto_copy_getters"] }
float-cmp = "0.10.0"
insta = "1.49.0"
libc = "0.2.190"
num_enum = "0.7.6"
num-traits = "0.2.19"
proptest = "1.11.0"
rstest = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.21"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
