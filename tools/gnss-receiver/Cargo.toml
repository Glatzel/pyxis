[package]
name = "gnss-receiver"
version = "0.0.46"
edition = "2024"

[[bin]]
name = "gnss-receiver"
path = "src/main.rs"

[[bin]]
name = "deadlock_detection"
path = "tools/deadlock_detection.rs"

[[bin]]
name = "export-schema"
path = "tools/export_schema.rs"

[[bin]]
name = "list-devices"
path = "tools/list_devices.rs"

[dependencies]
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11", features = ["tracing"] }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
rax = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
rax-nmea = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }
serialport-ext = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.10.11" }

proj = { path = "../../rust/crates/proj" }
pyxis = { path = "../../rust/crates/pyxis", features = ["serde"] }

bpaf = { version = "0.9.28", features = ["batteries", "derive"] }
chrono = "0.4.45"
crossterm = "0.29.0"
directories = "6.0.0"
parking_lot = { version = "0.13.0", features = ["deadlock_detection"] }
ratatui = "0.30.2"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-serial = "5.5.0"
toml = "1.1.8"
