[package]
name = "pyxis-cli"
version = "0.0.44"
edition = "2024"

[[bin]]
name = "pyxis"
path = "src/main.rs"

[dependencies]
clerk = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.8.22", features = ["tracing"] }
mischief = { git = "https://github.com/Glatzel/toolbox", tag = "v2026.8.22" }

proj = { path = "../../rust/crates/proj" }
pyxis = { path = "../../rust/crates/pyxis", features = ["serde"] }

bpaf = { version = "0.9.27", features = ["batteries", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["filters"] }
rstest = "0.26.1"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
